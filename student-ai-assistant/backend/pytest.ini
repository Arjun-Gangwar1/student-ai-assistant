[pytest]
testpaths = tests
asyncio_mode = auto
# Each test gets its own loop; asyncpg connections must not cross loops.
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
markers =
    db: needs a live Postgres (an embedded one is started automatically)
    llm: calls a real LLM provider; skipped unless RUN_LLM_TESTS=1
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
